  <g transform="translate(74, 14)">
    <text x="0" y="22" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.06em">ISEP BATCH 1</text>
    <text x="0" y="40" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#D4A24C" letter-spacing="0.22em">CURATED ARCHIVE</text>
