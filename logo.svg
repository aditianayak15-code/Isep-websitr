<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" fill="none">
  <!-- Container / Background plate for universal visibility -->
  <rect width="340" height="70" rx="10" fill="#141416" stroke="#D4A24C" stroke-width="1.2" stroke-opacity="0.35"/>
  
  <!-- Archival Emblem / Compass-Monument Icon -->
  <g transform="translate(14, 11)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#1F1F24" stroke="#D4A24C" stroke-width="1.5"/>
    <rect x="4" y="4" width="40" height="40" rx="6" stroke="#D4A24C" stroke-width="1" stroke-dasharray="3 2" stroke-opacity="0.6" fill="none"/>
    <!-- Compass / Monument glyph -->
    <path d="M15 36L24 16L33 36" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="16" r="3.2" fill="#D4A24C" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M12 40H36" stroke="#D4A24C" stroke-width="2" stroke-linecap="round"/>
